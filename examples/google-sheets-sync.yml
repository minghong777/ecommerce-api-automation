# Example only. Review then copy to .github/workflows/google-sheets-sync.yml.
# Not active until explicitly installed/pushed. Never run against untrusted PRs.
name: CommerceFlow scheduled snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # 07:00 Asia/Taipei, GitHub cron is UTC
permissions:
  contents: read
concurrency:
  group: commerceflow-sheets
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sheets-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Synchronize dedicated demo report tabs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: python -m src.automation --source offline --sync --replace-managed-tabs
